# Newsroom contract for << Org name >>.
#
# Every key the runtime reads is present below, with a comment saying what it
# changes. Anything written << like this >> is a blank for you to fill in;
# everything else is a working default. A key this file does not name is
# ignored with a warning from `newsroom check`, not refused, so check spelling
# there before assuming a setting took effect.

org:
  name: << Org name >>
  site: << https://example.org >>

# --- What is read ---------------------------------------------------------------
feed:
  sources: # RSS or Atom URLs, read once per run; a failing feed is logged, not fatal
    - url: << https://example.org/feed.xml >>
      name: << Publisher >>
  # The closed list of sections a story can be filed under. Every persona's
  # `sections:` weights use these keys. Add or rename here and in each persona.
  sections: [BUSINESS, TECHNOLOGY, POLICY, SCIENCE, CULTURE, LOCAL]
  lookback_hours: 36 # items older than this are not read
  max_stories: 40 # newest first; lower this if a small local model fails triage
  skip_seen_days: 3 # a story id first seen within N days is not triaged again
  summary_chars: 600 # feed summary is cut here before it reaches a prompt

# --- Which model -----------------------------------------------------------------
provider:
  kind: openai # openai (any OpenAI-compatible endpoint) | anthropic | fake
  base_url: https://api.openai.com/v1 # e.g. http://localhost:11434/v1 for Ollama
  model: << model id >>
  api_key_env: OPENAI_API_KEY # the NAME of the env var that holds the key, never the key
  json_mode: false # openai kind only: also send response_format json_object
  timeout_s: 120
  max_tokens:
    triage: 2048
    draft: 4096
    debate: 4096

# --- Who writes, and how easily --------------------------------------------------
personas:
  enabled: [operator, skeptic, builder, advocate, strategist]
  draft_threshold: 4 # stance (0-5) at or above which a persona drafts; 3 flags only
  max_drafts_per_persona: 2 # per run; silence is the default

# --- When two or more flag the same story ----------------------------------------
debate:
  enabled: true
  max_participants: 3 # top-N by stance when more than N flag one story
  outcome: auto # auto: two-views or merged, decided by who stands | two-views: never merge
  max_words_per_reply: 250

# --- Where drafts go -------------------------------------------------------------
output:
  drafts_dir: newsroom/drafts # relative to the directory `newsroom` runs in
  disclosure: "AI-drafted by {display_name}, an AI persona, on behalf of {org}. Unreviewed. Not {org}'s position until a reviewer approves it."
  github:
    repo: << org/repo >> # one issue per flagged story; blank disables issues; env NEWSROOM_GITHUB_REPO overrides
    labels: [newsroom, unreviewed]
    assignees: [<< reviewer-handle >>]

# --- Who decides -----------------------------------------------------------------
review:
  reviewers: [<< handle >>] # the runtime refuses to run while this is empty

guardrails:
  file: guardrails.md
  modified: false # set true only if you edited guardrails.md, and say why in shared.md

run:
  state_file: newsroom/.state.json # idempotency: a rerun on the same day repeats nothing
  timezone: UTC # decides what "today" is
