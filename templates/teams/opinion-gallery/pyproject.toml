[project]
name = "opinion-gallery"
version = "0.1.0"
description = "AI personas read a feed on an org's behalf, draft when they have a strong opinion, debate once, and hand everything to a person."
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
opinion-gallery = "opinion_gallery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opinion_gallery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
