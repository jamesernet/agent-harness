# Copy to .github/workflows/opinion-gallery.yml in the org's repo, where the gallery
# directory and the contract live. Adjust the contract path and the secret
# name to match provider.api_key_env in config.yml.
#
# What this does on each run: fetch, triage, draft, debate, write drafts/ and
# the state file, open one issue per piece from the runner's own token, then
# commit the drafts and state back. The state file must be committed because
# the runner is ephemeral; without it a rerun the same day repeats every call.
#
# If main is protected, push to a `opinion-gallery` branch and open a pull request
# instead of pushing to the default branch.
name: opinion-gallery
on:
  schedule:
    - cron: "0 6 * * 1-5" # weekday mornings, UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: opinion-gallery
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the gallery
        working-directory: opinion-gallery
        run: uv run --locked --extra anthropic opinion-gallery run --contract contracts/<org>
        env:
          # whichever of these provider.api_key_env names
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh is preinstalled on runners and reads this
          OPINION_GALLERY_GITHUB_REPO: ${{ github.repository }}
      - name: Commit drafts and state
        # Same working-directory as the run step, because the paths below are the
        # ones config.yml declares and those are relative to the directory the
        # gallery runs in. Without it this step's cwd is the workspace root, the
        # pathspec matches nothing, `git add` exits 128, and the step fails on
        # every run — so the state is never committed and a rerun repeats every
        # paid call, which is the thing committing the state exists to prevent.
        working-directory: opinion-gallery
        run: |
          git config user.name "opinion-gallery"
          git config user.email "opinion-gallery@users.noreply.github.com"
          # Both, because this step is named for both; only the state was staged.
          # Each is guarded because `git add` exits 128 on a pathspec that
          # matches nothing, and on a morning when every persona stayed quiet
          # there are no drafts to stage — the quiet day is the common case.
          for staged in opinion-gallery/.state.json opinion-gallery/drafts; do
            [ -e "$staged" ] && git add "$staged"
          done
          git diff --cached --quiet || git commit -m "opinion-gallery: drafts for $(date -u +%F)"
          git push
