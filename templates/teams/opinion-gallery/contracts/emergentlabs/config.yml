# Opinion gallery contract for Emergent Labs: the worked example.
#
# Everything in this contract comes from facts already public in this
# repository's brand/ directory. The three values an org would never publish
# (which feeds it reads, which repo its issues open in, who reviews) are left
# as blanks on purpose; a real copy of this contract lives outside this repo.

org:
  name: Emergent Labs
  site: https://emergentlabs.xyz

feed:
  sources:
    - url: << https://example.org/feed.xml >> # the lab's feed list is not public
      name: << Publisher >>
  sections: [BUSINESS, TECHNOLOGY, POLICY, SCIENCE, CULTURE, LOCAL]
  lookback_hours: 36
  max_stories: 40
  skip_seen_days: 3
  summary_chars: 600

provider:
  kind: anthropic
  base_url: ""
  model: claude-opus-5
  api_key_env: ANTHROPIC_API_KEY
  json_mode: false
  timeout_s: 120
  max_tokens:
    triage: 2048
    draft: 4096
    debate: 4096

personas:
  enabled: [operator, skeptic, builder, strategist] # advocate off: the lab writes for founders, not a public it represents
  draft_threshold: 4
  max_drafts_per_persona: 1 # a lab this size can review one piece per persona per day

debate:
  enabled: true
  max_participants: 2
  outcome: auto
  max_words_per_reply: 200

output:
  drafts_dir: opinion-gallery/drafts
  disclosure: "AI-drafted by {display_name}, an AI persona, on behalf of {org}. Unreviewed. Not {org}'s position until a reviewer approves it."
  github:
    repo: << org/repo >> # lives outside this repository
    labels: [opinion-gallery, unreviewed]
    assignees: []

review:
  reviewers: [<< handle >>]

guardrails:
  file: guardrails.md
  modified: false

run:
  state_file: opinion-gallery/.state.json
  timezone: UTC
