# Skill bundles — which skills a class of project actually uses.
#
# Format: <bundle>|<skill>
# A line `<bundle>|+<other>` includes every skill of <other>. Resolution is
# transitive and order-independent; a cycle terminates rather than recursing.
#
# This file is the source of truth for the grouping, because this repository is
# the source of truth for the skills. A consuming repository may carry a copy so
# it works without a checkout here, but the copy is derived, never authored.
#
# Used by:
#   bin/install-skills.sh --bundle <name>    what lands in ~/.claude/skills
#
# Choosing a bundle other than `all` is what makes selection real: a project's
# own .claude/skills/ is ADDITIVE and cannot hide a globally installed skill, so
# until the global set is narrowed, every project sees everything.

# --- core: applies to any codebase -------------------------------------------
core|codebase-design
core|domain-modeling
core|diagnosing-bugs
core|tdd
core|triage
core|grab
core|handoff
core|start-a-session
core|review-merge-queue
core|to-issues
core|interview-me
core|improve-codebase-architecture
core|setup-skills
core|metadata-audit
core|docs-drift-audit
core|tech-due-diligence

# --- website: something people look at ---------------------------------------
website|+core
website|product-ux-review
website|web-perf
website|data-privacy-review
website|site-visual-baseline
website|website-audit-package
website|shopify-storefront-review
# review-prose sits here because a website is where published prose reliably
# lives, not because prose is a website property — a platform writes
# announcements and fintech writes reports. Note this controls INSTALLATION,
# not triggering: the skill names README as a trigger, so it fires on READMEs
# in every project that installs it. Move it to core when a non-website
# project wants it rather than assuming it does.
website|review-prose

# --- webapp: a website that holds user data ----------------------------------
webapp|+website
webapp|threat-model

# --- platform: a backend other things depend on ------------------------------
platform|+core
platform|threat-model
platform|data-privacy-review

# --- fintech: money moves. Additive on top of another bundle -----------------
fintech|money-movement-review
fintech|pci-dss-scoping
fintech|kyc-aml-review

# --- metered: these skills bill a third-party API per run ---------------------
# Reserved name. `all` deliberately EXCLUDES every skill listed here, so a
# fresh account cannot acquire a skill that spends money without naming it.
# Install them by making the choice stick, not with a one-shot flag:
#   git config --global llmctx.skillBundle webapp,metered
#   llmctx skills install
# `--bundle` writes nothing, so a plain install afterwards resolves `all`
# again and PRUNES the metered skill straight back off the machine.
metered|gemini-motion

# `all` is not listed. It means whatever this repository ships today MINUS the
# `metered` members above, so enumerating it would rot on every addition and
# quietly stop installing the thing that was just added. The one subtraction is
# in code (bin/install-skills.sh) because a default that spends money is not a
# default anyone chose.
