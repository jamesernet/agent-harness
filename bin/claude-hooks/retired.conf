# Claude hook file names this repository used to ship: old|new, one per line.
#
# The settings merge in bin/build-adapters.sh keeps any local hook entry naming a
# script this repository does not ship, so that a hand-written hook survives an
# install. A renamed hook of ours would be kept by the same rule, registered
# beside its successor in every account. A name listed here is still ours: its
# settings entry is dropped, and the file the previous release installed is
# replaced by a shim that runs the successor, because a session that started
# before the upgrade still holds the old path and a hook command that cannot
# start does not block.
#
# A line stays after its shim is removed. An account created by copying another
# can carry an old entry long after the rename.
#
# A name the account owner declared with llmctx.accountHook is theirs and is
# left alone.
branch-policy.sh|branch-gate.sh
